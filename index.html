<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dossier Ejecutivo: IA en Operaciones Aéreas</title>
    <!-- Tailwind CSS (via CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            overflow: hidden; /* Prevent body scroll, handle in main */
        }
        
        /* Smooth transitions */
        .fade-in {
            animation: fadeIn 0.4s ease-in-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Sidebar item hover effects */
        .sidebar-item {
            transition: all 0.2s ease;
        }
        .sidebar-item.active {
            background-color: #2563eb; /* blue-600 */
            color: white;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        .sidebar-item:not(.active):hover {
            background-color: #1e293b; /* slate-800 */
            color: #e2e8f0; /* slate-200 */
        }

        /* Badge Styles */
        .badge {
            display: inline-block;
            padding: 0.25rem 0.6rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            border-width: 1px;
        }
        .badge-danger { background-color: #fee2e2; color: #991b1b; border-color: #fecaca; }
        .badge-warning { background-color: #fef3c7; color: #92400e; border-color: #fde68a; }
        .badge-success { background-color: #d1fae5; color: #065f46; border-color: #a7f3d0; }
        .badge-info { background-color: #dbeafe; color: #1e40af; border-color: #bfdbfe; }
        .badge-purple { background-color: #f3e8ff; color: #6b21a8; border-color: #e9d5ff; }
        .badge-neutral { background-color: #f1f5f9; color: #1e293b; border-color: #e2e8f0; }

        /* Table styles */
        .table-row-hover:hover { background-color: #f8fafc; }
        .table-row-recommended { background-color: #eff6ff; } /* blue-50 */
    </style>
</head>
<body class="bg-slate-50 text-slate-800">

    <div class="flex h-screen">
        <!-- Sidebar -->
        <aside class="w-72 bg-slate-900 text-slate-100 flex flex-col shadow-2xl z-10 flex-shrink-0">
            <div class="p-6">
                <div class="flex items-center space-x-3 mb-2">
                    <div class="p-2 bg-blue-600 rounded-lg">
                        <i data-lucide="plane" class="text-white w-6 h-6"></i>
                    </div>

                </div>

            </div>
            
            <nav class="flex-1 px-4 space-y-2 overflow-y-auto" id="sidebar-nav">

            <!-- Section content will be injected here by JS -->
        </main>
    </div>

    <script>
        // --- Data Definitions ---
        const sections = [

            { id: 'opportunities', icon: 'layers', label: '3. Casos de Uso (RICE)' },

            { id: 'recommendation', icon: 'check-circle-2', label: '5. Business Case y RACI' }
        ];

        let activeSectionId = 'context';

        // --- HTML Content Generators ---

        function generateContextHTML() {
            return `
                <div class="space-y-8 fade-in max-w-5xl mx-auto">

                            <i data-lucide="target" class="text-blue-600 mr-2 w-5 h-5"></i>

                                <p class="text-sm text-slate-600 mt-2 mb-3"><strong>Objetivo:</strong> Reducción crítica del tiempo de AOG (Aircraft on Ground).</p>
                                <p class="text-sm text-slate-600">La implementación de IA optimiza el mantenimiento correctivo y preventivo, impactando directamente la rentabilidad al evitar ineficiencias.</p>
                            </div>

        function generateEcosystemHTML() {

                                <i data-lucide="layers" class="mr-2 text-blue-600 w-5 h-5"></i> Componentes del Ecosistema
                            </h3>
                            
                            <div class="space-y-5">
                                <div class="flex gap-4 items-start">
                                    <i data-lucide="brain-circuit" class="text-indigo-500 w-6 h-6 mt-0.5"></i>

                                    </div>
                                </div>
                                <div class="flex gap-4 items-start">
                                    <i data-lucide="cloud" class="text-emerald-500 w-6 h-6 mt-0.5"></i>
                                    <div>
                                        <h4 class="font-bold text-slate-900">Hyperscalers (Azure/AWS)</h4>
                                        <p class="text-sm text-slate-600 mt-1">Infraestructura crítica que absorbe el 75% del CapEx global. Garantiza el cumplimiento normativo de seguridad de datos.</p>
                                    </div>
                                </div>
                                <div class="flex gap-4 items-start">
                                    <i data-lucide="briefcase" class="text-amber-500 w-6 h-6 mt-0.5"></i>
                                    <div>
                                        <h4 class="font-bold text-slate-900">Herramientas & Servicios</h4>
                                        <p class="text-sm text-slate-600 mt-1">Microsoft Copilot para oficina, CRMs con IA nativa y Consultoras para integración de sistemas legacy (Part-145) y EU AI Act.</p>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="bg-slate-900 text-white p-6 rounded-2xl shadow-lg space-y-6">
                            <h3 class="text-xl font-bold flex items-center border-b border-slate-700 pb-4">
                                <i data-lucide="trending-up" class="mr-2 text-blue-400 w-5 h-5"></i> Tendencias (Horizonte 24m)
                            </h3>
                            
                            <div class="space-y-4">
                                <div class="bg-slate-800/50 p-4 rounded-xl border border-slate-700">
                                    <h4 class="font-bold text-blue-300 text-sm">Intelligent Experience Architecture</h4>
                                    <p class="text-sm text-slate-300 mt-1">De menús estáticos a navegación conversacional. Interacción natural para consultar la MEL o turnos de tripulación.</p>
                                </div>
                                <div class="bg-slate-800/50 p-4 rounded-xl border border-slate-700">
                                    <h4 class="font-bold text-emerald-300 text-sm">Edge AI</h4>
                                    <p class="text-sm text-slate-300 mt-1">Procesamiento local en dispositivos de vuelo y hangares. Baja latencia para diagnósticos en entornos de conectividad limitada.</p>
                                </div>
                                <div class="bg-slate-800/50 p-4 rounded-xl border border-slate-700">
                                    <h4 class="font-bold text-purple-300 text-sm">IA Multimodal "Reasoning Companion"</h4>
                                    <p class="text-sm text-slate-300 mt-1">Integración de manuales, audio de cabina y vídeos de boroscopio para diagnosticar daños en álabes de turbinas mediante RAG.</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function generateOpportunitiesHTML() {
            const cases = [
                { name: 'Gestión de Adiestramientos', impact: 5, viability: 5, data: 4, effort: 2, speed: 5, total: 21, rec: true },
                { name: 'Digitalización de Partes', impact: 4, viability: 4, data: 3, effort: 3, speed: 4, total: 18, rec: false },
                { name: 'Asistente de Mantenimiento', impact: 5, viability: 3, data: 2, effort: 4, speed: 3, total: 17, rec: false },
                { name: 'Gestión de Stock', impact: 3, viability: 3, data: 4, effort: 3, speed: 3, total: 16, rec: false },
                { name: 'Seguridad Perimetral', impact: 2, viability: 4, data: 3, effort: 3, speed: 2, total: 14, rec: false },
            ];

            const getScoreColor = (val) => {
                if (val >= 4) return 'text-emerald-600 font-bold';
                if (val === 3) return 'text-amber-600 font-bold';
                return 'text-red-600 font-bold';
            };

            const tableRows = cases.map(c => `
                <tr class="table-row-hover ${c.rec ? 'table-row-recommended' : ''} border-b border-slate-100 last:border-0">
                    <td class="px-6 py-4 font-semibold text-slate-900 flex items-center">
                        ${c.rec ? '<i data-lucide="star" class="text-yellow-500 fill-yellow-500 mr-2 w-5 h-5"></i>' : ''}
                        ${c.name}
                    </td>
                    <td class="px-4 py-4 text-center"><span class="${getScoreColor(c.impact)}">${c.impact}</span></td>
                    <td class="px-4 py-4 text-center"><span class="${getScoreColor(c.viability)}">${c.viability}</span></td>
                    <td class="px-4 py-4 text-center"><span class="${getScoreColor(c.data)}">${c.data}</span></td>
                    <td class="px-4 py-4 text-center"><span class="${getScoreColor(5 - c.effort)}">${c.effort}</span></td>
                    <td class="px-4 py-4 text-center"><span class="${getScoreColor(c.speed)}">${c.speed}</span></td>
                    <td class="px-6 py-4 text-center"><span class="badge ${c.rec ? 'badge-success' : 'badge-neutral'} text-sm font-black">${c.total}</span></td>
                </tr>
            `).join('');

            return `
                <div class="space-y-8 fade-in max-w-5xl mx-auto">
                    <div>
                        <h2 class="text-3xl font-bold text-slate-900">Casos de Uso (Framework RICE / Gartner Prism)</h2>

                    </div>

                                    <tr>
                                        <th class="px-6 py-4 font-bold text-slate-700">Proyecto</th>
                                        <th class="px-4 py-4 text-center" title="Impacto en Negocio (Peso Alto)">Impacto (5)</th>
                                        <th class="px-4 py-4 text-center" title="Viabilidad Técnica (Peso Alto)">Viabilidad (5)</th>
                                        <th class="px-4 py-4 text-center" title="Calidad de Datos Actual (Peso Medio-Alto)">Calidad Datos (4)</th>
                                        <th class="px-4 py-4 text-center" title="Esfuerzo Requerido (Inverso, Peso Medio)">Esfuerzo (2)</th>
                                        <th class="px-4 py-4 text-center" title="Velocidad de Retorno (Peso Alto)">Retorno Rápido (5)</th>
                                        <th class="px-6 py-4 text-center font-bold text-slate-900">Puntaje Total</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${tableRows}
                                </tbody>
                            </table>
                        </div>
                        <div class="p-4 bg-blue-50 border-t border-blue-100 text-sm text-blue-800 flex items-start">
                            <i data-lucide="info" class="mr-2 flex-shrink-0 mt-0.5 w-5 h-5"></i>
                            <p><strong>Gestión de Adiestramientos</strong> lidera indiscutiblemente la matriz con 21 puntos, ofreciendo un balance perfecto entre retorno inmediato, viabilidad y mitigación de un riesgo altísimo.</p>
                        </div>
                    </div>

                    <!-- Detalles Casos -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="p-4 border border-slate-200 rounded-xl bg-white shadow-sm">
                            <h4 class="font-bold text-slate-800 text-sm flex items-center mb-2"><i data-lucide="file-check-2" class="w-4 h-4 mr-2 text-blue-600"></i>Digitalización de Partes (18 pts)</h4>
                            <p class="text-xs text-slate-600">Agentes de ingesta OCR contra el ERP. Reduce el trabajo de back-office un 20% y ofrece datos en tiempo real.</p>
                        </div>
                        <div class="p-4 border border-slate-200 rounded-xl bg-white shadow-sm">

                        </div>
                        <div class="p-4 border border-slate-200 rounded-xl bg-white shadow-sm">
                            <h4 class="font-bold text-slate-800 text-sm flex items-center mb-2"><i data-lucide="package" class="w-4 h-4 mr-2 text-blue-600"></i>Gestión de Stock (16 pts)</h4>
                            <p class="text-xs text-slate-600">Modelo predictivo de demanda. Proyecta una mejora del Margen Bruto del +12% al optimizar inventario.</p>
                        </div>
                        <div class="p-4 border border-slate-200 rounded-xl bg-white shadow-sm">
                            <h4 class="font-bold text-slate-800 text-sm flex items-center mb-2"><i data-lucide="video" class="w-4 h-4 mr-2 text-blue-600"></i>Seguridad Perimetral (14 pts)</h4>

                                </div>
                                
                                <div class="relative pl-6">

        // --- Core Logic ---

        function renderSidebar() {
            const navContainer = document.getElementById('sidebar-nav');
            navContainer.innerHTML = sections.map(section => `
                <button 
                    onclick="changeSection('${section.id}')"
                    class="sidebar-item w-full flex items-center space-x-3 px-4 py-3 rounded-lg text-left ${activeSectionId === section.id ? 'active' : 'text-slate-400'}"
                >
                    <i data-lucide="${section.icon}" class="w-5 h-5 ${activeSectionId === section.id ? 'text-blue-200' : 'text-slate-500'}"></i>
                    <span class="font-medium">${section.label}</span>
                </button>
            `).join('');
            
            // Re-initialize icons for newly added HTML
            lucide.createIcons();
        }

        function renderContent() {
            const mainContainer = document.getElementById('main-content');
            let contentHTML = '';

            switch (activeSectionId) {
                case 'context': contentHTML = generateContextHTML(); break;
                case 'ecosystem': contentHTML = generateEcosystemHTML(); break;
                case 'opportunities': contentHTML = generateOpportunitiesHTML(); break;
                case 'roadmap': contentHTML = generateRoadmapHTML(); break;
                case 'recommendation': contentHTML = generateRecommendationHTML(); break;
                default: contentHTML = generateContextHTML();
            }

            mainContainer.innerHTML = contentHTML;
            // Re-initialize icons for the main content area
            lucide.createIcons();
        }

        // Global function called by buttons
        window.changeSection = function(sectionId) {
            if (activeSectionId !== sectionId) {
                activeSectionId = sectionId;
                renderSidebar();
                renderContent();
            }
        };

        // Initialize application
        document.addEventListener('DOMContentLoaded', () => {
            renderSidebar();
            renderContent();
        });
    </script>
