        // 3. Controlador de la App
        class DashboardController {
            constructor() {
                this.activeSection = 'intro';
                this.navContainer = document.getElementById('navigation-menu');
                this.contentContainer = document.getElementById('content-area');
                this.titleElement = document.getElementById('section-title');
                
                this.init();
            }

            init() {
                this.renderNav();
                this.loadSection(this.activeSection);
            }

            renderNav() {
                this.navContainer.innerHTML = appData.sections.map(sec => `
                    <button 
                        data-id="${sec.id}"
                        class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl text-left text-[13px] ${this.activeSection === sec.id ? 'active' : 'text-slate-500 hover:bg-slate-50 hover:text-slate-700'}"
                    >
                        <i data-lucide="${sec.icon}" class="w-4 h-4 flex-shrink-0 ${this.activeSection === sec.id ? 'text-blue-600' : 'text-slate-400'}"></i>
                        <span class="truncate leading-tight">${sec.title}</span>
                    </button>
                `).join('');

                this.navContainer.querySelectorAll('.nav-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const id = e.currentTarget.getAttribute('data-id');
                        this.loadSection(id);
                    });
                });
            }

            loadSection(id) {
                this.activeSection = id;
                this.renderNav();
                
                const sectionData = appData.sections.find(s => s.id === id);
                this.titleElement.innerText = sectionData.title;

                this.contentContainer.innerHTML = Views[id]();
                
                // Inicializar iconos
                lucide.createIcons();
                
                // Scroll arriba
                document.querySelector('main').scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        // 4. Iniciar al cargar

            new DashboardController();
