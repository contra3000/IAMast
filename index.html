        // 3. Controlador de la App (JavaScript Vainilla)
        class DashboardController {
            constructor() {
                this.activeSection = 'estrategia';
                this.navContainer = document.getElementById('navigation-menu');
                this.contentContainer = document.getElementById('content-area');
                this.titleElement = document.getElementById('section-title');
                
                this.init();
            }

            init() {
                this.renderNav();
                this.loadSection(this.activeSection);
            }

            renderNav() {
                this.navContainer.innerHTML = appData.sections.map(sec => `
                    <button 
                        data-id="${sec.id}"
                        class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-r-xl text-left text-sm ${this.activeSection === sec.id ? 'active' : 'text-slate-500 hover:bg-slate-50'}"
                    >
                        <i data-lucide="${sec.icon}" class="w-5 h-5 ${this.activeSection === sec.id ? 'text-blue-600' : 'text-slate-400'}"></i>
                        ${sec.title}
                    </button>
                `).join('');

                // Asignar Event Listeners
                this.navContainer.querySelectorAll('.nav-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const id = e.currentTarget.getAttribute('data-id');
                        this.loadSection(id);
                    });
                });
            }

            loadSection(id) {
                this.activeSection = id;
                
                // Actualizar UI de Navegación
                this.renderNav();
                
                // Actualizar Título
                const sectionData = appData.sections.find(s => s.id === id);
                this.titleElement.innerText = sectionData.title;

                // Actualizar Contenido
                this.contentContainer.innerHTML = Views[id]();
                
                // Refrescar Iconos
                lucide.createIcons();
                
                // Scroll top smooth
                document.querySelector('main').scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        // 4. Inicializar al cargar el DOM
        document.addEventListener('DOMContentLoaded', () => {
            new DashboardController();
